name: Deploy to GitHub Pages

# Publishes the site whenever the save-the-date branch (or main) is updated.
on:
  push:
    branches:
      - main
      - claude/save-the-date-website-xag5wb
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one deployment at a time.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Turn GitHub Pages on automatically (needs pages: write, set above)
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # The whole repo root is the site (index.html at the top level).
          path: "."

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
